<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイアプリ一覧</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --accent: #0066cc;
            --text-main: #1a1a1a;
            --text-sub: #666666;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                "Yu Gothic", "Noto Sans JP", sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: 1.3rem;
            margin: 4px 0 20px;
            text-align: center;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-width: 480px;
            margin-inline: auto;
        }

        li {
            margin: 0 0 12px;
        }

        a.app-card {
            display: block;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        a.app-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .app-name {
            display: block;
            font-size: 17px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .app-desc {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* タップ領域を広めに確保（指での操作を想定） */
        @media (max-width: 600px) {
            a.app-card {
                padding: 18px 16px;
            }
        }
    </style>
</head>
<body>
    <h1>自作HTMLアプリ一覧</h1>
    <ul>
        <li>
            <a class="app-card" href="soji-manager.html">
                <span class="app-name">掃除タスクマネージャー</span>
                <span class="app-desc">掃除の管理ができます</span>
            </a>
        </li>
        <li>
            <a class="app-card" href="teiki-manager.html">
                <span class="app-name">定期券マネージャー</span>
                <span class="app-desc">定期券の管理ができます</span>
            </a>
        </li>
        <li>
            <a class="app-card" href="kintai.html">
                <span class="app-name">個人勤怠記録</span>
                <span class="app-desc">個人勤怠記録ができます</span>
            </a>
        </li>
        <li>
            <a class="app-card" href="lending_ledger.html">
                <span class="app-name">貸出台帳</span>
                <span class="app-desc">貸出台帳ができます</span>
            </a>
        </li>
    </ul>
</body>
</html>
