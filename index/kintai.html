<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出勤簿</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #e7eef4; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const dateKey = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const todayObj = () => {
  const n = new Date();
  return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() };
};
const hmNow = () => {
  const n = new Date();
  return `${pad(n.getHours())}:${pad(n.getMinutes())}`;
};
const toMinutes = (hm) => {
  if (!hm) return null;
  const [h, m] = hm.split(":").map(Number);
  return h * 60 + m;
};
const minutesToLabel = (mins) => {
  if (mins == null) return "―";
  const sign = mins < 0 ? "-" : "";
  mins = Math.abs(Math.round(mins));
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${sign}${h}時間${pad(m)}分`;
};
const breakMinutesFor = (worked) => {
  if (worked > 480) return 60;
  if (worked > 360) return 45;
  return 0;
};
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const weekdayLabel = (y, m, d) => ["日", "月", "火", "水", "木", "金", "土"][new Date(y, m - 1, d).getDay()];
const isWeekend = (y, m, d) => {
  const w = new Date(y, m - 1, d).getDay();
  return w === 0 || w === 6;
};
const monthLabel = (m) => ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"][m - 1];

const WORK_TYPE_OPTIONS = ["", "保守", "泊", "明", "M1", "M2", "N朝", "NX", "C", "MA", "MX", "中継", "休日", "法定", "有給"];
const HOLIDAY_TYPES = ["休日", "法定"];
const AUTO_FILL_TIMES = {
  "泊": ["19:00", "02:30"],
  "明": ["02:30", "09:30"],
  "保守": ["09:30", "17:30"],
  "M1": ["09:30", "17:30"],
  "N朝": ["09:30", "17:30"],
  "MX": ["09:30", "17:30"],
  "NX": ["11:00", "19:00"],
  "C": ["11:00", "19:00"],
  "M2": ["11:00", "19:00"],
};
const SPECIAL_STANDARD_HOURS = 7.5;
const SPECIAL_STANDARD_HOURS_TYPES = new Set([...Object.keys(AUTO_FILL_TIMES), "中継"]);
const LEAVE_COUNT_START = "2026-01-01";

const DEFAULT_SETTINGS = { standardHours: 8, paidLeaveTotal: 20 };
const STORAGE_KEY = "kintai-data-v1";

// window.storage only exists inside Claude.ai's artifact runtime. When this file is opened
// directly in a browser (double-clicked, or hosted elsewhere), fall back to localStorage so
// data still persists between visits instead of resetting empty every time.
const storageAdapter = {
  async get(key) {
    if (window.storage && typeof window.storage.get === "function") {
      try {
        const res = await window.storage.get(key, false);
        if (res) return res;
      } catch (e) {
        // fall through to localStorage
      }
    }
    try {
      const v = localStorage.getItem(key);
      return v ? { value: v } : null;
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    if (window.storage && typeof window.storage.set === "function") {
      try {
        await window.storage.set(key, value, false);
        return;
      } catch (e) {
        // fall through to localStorage
      }
    }
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      // storage unavailable (e.g. private browsing) — nothing more we can do
    }
  },
};

const downloadJsonFile = (settingsObj, recordsObj, memoStr, filename) => {
  const data = JSON.stringify({ settings: settingsObj, records: recordsObj, memo: memoStr }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

function KintaiApp() {
  const [loaded, setLoaded] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [records, setRecords] = useState({}); // dateKey -> {clockIn, clockOut, isLeave, note, remark, otStart, otEnd, locked}
  const [memo, setMemo] = useState("");
  const [view, setView] = useState(() => {
    const t = todayObj();
    return { y: t.y, m: t.m };
  });
  const [showSettings, setShowSettings] = useState(false);
  const [showLeave, setShowLeave] = useState(false);
  const [showMemo, setShowMemo] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [importPromptDismissed, setImportPromptDismissed] = useState(false);
  const [leavePickDate, setLeavePickDate] = useState("");
  const [clock, setClock] = useState(hmNow());
  const saveTimer = useRef(null);
  const fileInputRef = useRef(null);
  const fileHandleRef = useRef(null);

  const today = todayObj();
  const todayKey = dateKey(today.y, today.m, today.d);

  useEffect(() => {
    const id = setInterval(() => setClock(hmNow()), 1000 * 15);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await storageAdapter.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setSettings({ ...DEFAULT_SETTINGS, ...(parsed.settings || {}) });
          setRecords(parsed.records || {});
          setMemo(parsed.memo || "");
        }
      } catch (e) {
        // fresh start
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storageAdapter.set(STORAGE_KEY, JSON.stringify({ settings, records, memo }));
      } catch (e) {
        console.error("保存に失敗しました", e);
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [settings, records, memo, loaded]);

  const settingsRef = useRef(settings);
  const recordsRef = useRef(records);
  const memoRef = useRef(memo);
  useEffect(() => { settingsRef.current = settings; }, [settings]);
  useEffect(() => { recordsRef.current = records; }, [records]);
  useEffect(() => { memoRef.current = memo; }, [memo]);

  useEffect(() => {
    if (!loaded) return;
    const id = setInterval(async () => {
      if (!fileHandleRef.current) return;
      const data = JSON.stringify(
        { settings: settingsRef.current, records: recordsRef.current, memo: memoRef.current }, null, 2
      );
      try {
        const writable = await fileHandleRef.current.createWritable();
        await writable.write(data);
        await writable.close();
      } catch (e) {
        fileHandleRef.current = null;
      }
    }, 60 * 1000);
    return () => clearInterval(id);
  }, [loaded]);

  const updateRecord = useCallback((key, patch) => {
    setRecords((prev) => {
      const current = prev[key] || { clockIn: null, clockOut: null, isLeave: false, note: "", remark: "", otStart: null, otEnd: null, locked: false };
      if (current.locked && !("locked" in patch)) return prev; // day is locked; ignore edits
      return { ...prev, [key]: { ...current, ...patch } };
    });
  }, []);

  const standardHoursFor = (rec) => {
    const note = rec.note || "";
    if (HOLIDAY_TYPES.includes(note)) return 0;
    if (SPECIAL_STANDARD_HOURS_TYPES.has(note)) return SPECIAL_STANDARD_HOURS;
    return settings.standardHours;
  };

  const autoOvertimeMinutesFor = (rec) => {
    if (!rec || rec.isLeave) return 0;
    const inM = toMinutes(rec.clockIn);
    let outM = toMinutes(rec.clockOut);
    if (inM == null || outM == null) return 0;
    if (outM <= inM) outM += 24 * 60;
    const worked = outM - inM - breakMinutesFor(outM - inM);
    return Math.max(0, worked - standardHoursFor(rec) * 60);
  };

  const overtimeMinutesFor = (rec) => {
    if (!rec || rec.isLeave) return 0;
    if (rec.otStart && rec.otEnd) {
      const s = toMinutes(rec.otStart);
      let e = toMinutes(rec.otEnd);
      if (s != null && e != null) {
        if (e <= s) e += 24 * 60;
        return Math.max(0, e - s);
      }
    }
    return autoOvertimeMinutesFor(rec);
  };

  const dim = daysInMonth(view.y, view.m);
  const dayList = Array.from({ length: dim }, (_, i) => i + 1);

  let monthOvertime = 0;
  let monthWorkDays = 0;
  let monthHolidays = 0;
  let monthStatutoryHolidays = 0;
  let monthLeaveDays = 0;
  dayList.forEach((d) => {
    const rec = records[dateKey(view.y, view.m, d)];
    if (!rec) return;
    monthOvertime += overtimeMinutesFor(rec);
    if (rec.clockIn && rec.clockOut && !rec.isLeave) monthWorkDays += 1;
    if (rec.note === "休日") monthHolidays += 1;
    if (rec.note === "法定") monthStatutoryHolidays += 1;
    if (rec.isLeave) monthLeaveDays += 1;
  });

  const allLeaveDatesSorted = Object.keys(records)
    .filter((k) => records[k].isLeave && k >= LEAVE_COUNT_START)
    .sort();
  const leaveDatesThisYear = Object.keys(records)
    .filter((k) => records[k].isLeave && k.startsWith(`${view.y}-`))
    .sort();
  const leavesThisYear = leaveDatesThisYear.length;
  const leaveRemaining = settings.paidLeaveTotal - leavesThisYear;
  const isEmpty = Object.keys(records).length === 0;

  const changeMonth = (delta) => {
    let m = view.m + delta;
    let y = view.y;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setView({ y, m });
  };

  const jumpToDate = (key) => {
    const el = document.getElementById(`row-${key}`);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("k-row-flash");
    setTimeout(() => el.classList.remove("k-row-flash"), 1200);
  };

  const onNoteChange = (key, val) => {
    const patch = { note: val, remark: val, isLeave: val === "有給" };
    if (val in AUTO_FILL_TIMES) {
      const [ci, co] = AUTO_FILL_TIMES[val];
      patch.clockIn = ci;
      patch.clockOut = co;
    } else if (val === "" || HOLIDAY_TYPES.includes(val) || val === "有給" || val === "中継") {
      patch.clockIn = null;
      patch.clockOut = null;
    }
    updateRecord(key, patch);
  };

  const toggleLeave = (key, isLeave) => {
    if (isLeave) updateRecord(key, { isLeave: true, clockIn: null, clockOut: null, note: "有給", remark: "有給" });
    else updateRecord(key, { isLeave: false, note: "", remark: "" });
  };

  const toggleDayLock = (key) => {
    const current = records[key] || { locked: false };
    updateRecord(key, { locked: !current.locked });
  };

  const addLeave = () => {
    if (!leavePickDate) return;
    updateRecord(leavePickDate, { isLeave: true, clockIn: null, clockOut: null, note: "有給", remark: "有給" });
    setLeavePickDate("");
  };

  const resetAllData = () => {
    setRecords({});
    setConfirmReset(false);
  };

  const handleExport = async () => {
    const data = JSON.stringify({ settings, records, memo }, null, 2);
    try {
      if (window.showSaveFilePicker) {
        if (!fileHandleRef.current) {
          fileHandleRef.current = await window.showSaveFilePicker({
            suggestedName: `kintai-data-${todayKey}.json`,
            types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
          });
        }
        const writable = await fileHandleRef.current.createWritable();
        await writable.write(data);
        await writable.close();
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
      fileHandleRef.current = null;
    }
    downloadJsonFile(settings, records, memo, `kintai-data-${todayKey}.json`);
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        setSettings({ ...DEFAULT_SETTINGS, ...(parsed.settings || {}) });
        setRecords(parsed.records || {});
        setMemo(parsed.memo || "");
      } catch (err) {
        alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  if (!loaded) {
    return <div className="kintai-root kintai-loading">読み込み中…</div>;
  }

  return (
    <div className="kintai-root">
      <input
        ref={fileInputRef}
        type="file"
        accept="application/json"
        style={{ display: "none" }}
        onChange={handleImportFile}
      />

      <header className="k-header">
        <div className="k-header-left">
          <span className="k-eyebrow">個人勤怠記録</span>
          <h1>出勤簿</h1>
        </div>
        <div className="k-header-right">
          <button className="k-header-export" onClick={handleExport}>⬇ JSON保存</button>
          <div className="k-clock">{clock}</div>
          <div className="k-date">
            {today.y}年{today.m}月{today.d}日（{weekdayLabel(today.y, today.m, today.d)}）
          </div>
        </div>
      </header>

      {isEmpty && !importPromptDismissed && (
        <div className="k-import-banner">
          <span>記録がまだありません。バックアップのJSONファイルがあればインポートできます。</span>
          <div className="k-import-banner-buttons">
            <button className="k-btn-secondary" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              ⬆ インポート
            </button>
            <button className="k-btn-secondary-outline" onClick={() => setImportPromptDismissed(true)}>
              スキップ
            </button>
          </div>
        </div>
      )}

      <div className="k-ledger">
        <div className="k-ledger-head">
          <button className="k-nav" onClick={() => changeMonth(-1)}>‹</button>
          <h2>{view.y}年 {monthLabel(view.m)}</h2>
          <button className="k-nav" onClick={() => changeMonth(1)}>›</button>
        </div>

        <div className="k-mini-cal">
          <div className="k-mini-cal-weekdays">
            {["日", "月", "火", "水", "木", "金", "土"].map((wd) => (
              <div key={wd} className={`k-mini-cal-wd ${wd === "日" || wd === "土" ? "k-weekend-text" : ""}`}>{wd}</div>
            ))}
          </div>
          <div className="k-mini-cal-grid">
            {Array.from({ length: (new Date(view.y, view.m - 1, 1).getDay()) }).map((_, i) => (
              <div key={`blank-${i}`} className="k-mini-cal-day k-mini-cal-blank" />
            ))}
            {dayList.map((d) => {
              const key = dateKey(view.y, view.m, d);
              const rec = records[key];
              const isToday = key === todayKey;
              const weekend = isWeekend(view.y, view.m, d);
              const cls = [
                "k-mini-cal-day",
                isToday ? "k-mini-cal-today" : "",
                rec?.isLeave ? "k-mini-cal-leave" : "",
                weekend && !isToday && !rec?.isLeave ? "k-weekend-text" : "",
              ].join(" ").trim();
              return (
                <button key={key} className={cls} onClick={() => jumpToDate(key)} title={`${d}日${rec?.note ? " " + rec.note : ""}`}>
                  <span className="k-mini-cal-daynum">{d}</span>
                  {rec?.note && <span className="k-mini-cal-note">{rec.note}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div className="k-table-wrap">
          <table className="k-table">
            <thead>
              <tr>
                <th className="k-col-date">日付</th>
                <th className="k-col-note">業務内容</th>
                <th>出勤</th>
                <th>退勤</th>
                <th className="k-col-ot">時間外</th>
                <th className="k-col-work">作業時間</th>
                <th className="k-col-remark">備考</th>
              </tr>
            </thead>
            <tbody>
              {dayList.map((d) => {
                const key = dateKey(view.y, view.m, d);
                const rec = records[key] || {};
                const weekend = isWeekend(view.y, view.m, d);
                const isToday = key === todayKey;
                const dayLocked = !!rec.locked;
                const rowClass = rec.isLeave ? "k-leave-row" : isToday ? "k-today" : d % 2 === 0 ? "k-stripe-b" : "k-stripe-a";
                let otMinutes = 0;
                let workText = "―";
                const hasBasis = (rec.clockIn && rec.clockOut) || (rec.otStart && rec.otEnd);
                if (!rec.isLeave && hasBasis) {
                  otMinutes = overtimeMinutesFor(rec);
                  workText = minutesToLabel(standardHoursFor(rec) * 60 + otMinutes);
                }
                return (
                  <tr key={key} id={`row-${key}`} className={rowClass}>
                    <td className="k-col-date" data-label="日付">
                      <span className="k-day-num">{d}</span>
                      <span className={`k-day-wd ${weekend ? "k-weekend-text" : ""}`}>（{weekdayLabel(view.y, view.m, d)}）</span>
                      <button
                        className={`k-lock-btn ${dayLocked ? "k-lock-btn-locked" : ""}`}
                        onClick={() => toggleDayLock(key)}
                        title="この日をロック/解除"
                      >
                        {dayLocked ? "🔒 ロック中" : "🔓 編集可"}
                      </button>
                    </td>
                    <td className="k-col-note" data-label="業務内容">
                      <select
                        className="k-note-select"
                        disabled={dayLocked}
                        style={HOLIDAY_TYPES.includes(rec.note) ? { color: "#a35d4e", fontWeight: 700 } : undefined}
                        value={rec.note || ""}
                        onChange={(e) => onNoteChange(key, e.target.value)}
                      >
                        {WORK_TYPE_OPTIONS.map((opt) => (
                          <option key={opt || "blank"} value={opt} style={HOLIDAY_TYPES.includes(opt) ? { color: "#a35d4e" } : undefined}>
                            {opt || "―"}
                          </option>
                        ))}
                      </select>
                    </td>
                    {rec.isLeave ? (
                      <td colSpan={2} className="k-leave-cell" data-label="出勤・退勤">
                        <span className="k-leave-stamp">有休</span>
                        <button className="k-mini-btn" disabled={dayLocked} onClick={() => toggleLeave(key, false)} title="有休を取消">↺</button>
                      </td>
                    ) : (
                      <>
                        <td data-label="出勤">
                          <input type="time" disabled={dayLocked} value={rec.clockIn || ""} onChange={(e) => updateRecord(key, { clockIn: e.target.value })} />
                        </td>
                        <td data-label="退勤">
                          <input type="time" disabled={dayLocked} value={rec.clockOut || ""} onChange={(e) => updateRecord(key, { clockOut: e.target.value })} />
                        </td>
                      </>
                    )}
                    <td className="k-ot-cell" data-label="時間外">
                      {rec.isLeave ? (
                        "―"
                      ) : (
                        <div className="k-ot-range">
                          <div className="k-ot-range-inputs">
                            <input type="time" disabled={dayLocked} className="k-ot-time" value={rec.otStart || ""}
                              onChange={(e) => updateRecord(key, { otStart: e.target.value })} />
                            <span>〜</span>
                            <input type="time" disabled={dayLocked} className="k-ot-time" value={rec.otEnd || ""}
                              onChange={(e) => updateRecord(key, { otEnd: e.target.value })} />
                          </div>
                          <div className={`k-ot-result ${rec.otStart && rec.otEnd ? "k-ot-manual" : ""}`}>
                            {hasBasis ? minutesToLabel(otMinutes) : "―"}
                          </div>
                        </div>
                      )}
                    </td>
                    <td className="k-ot-cell k-work-cell k-col-work" data-label="作業時間">{workText}</td>
                    <td className="k-col-remark" data-label="備考">
                      {rec.isLeave ? (
                        <span className="k-leave-seq-cell">{allLeaveDatesSorted.indexOf(key) + 1}回目</span>
                      ) : (
                        <input
                          type="text"
                          disabled={dayLocked}
                          className="k-remark-input"
                          placeholder="備考"
                          title={rec.remark || ""}
                          value={rec.remark || ""}
                          onChange={(e) => updateRecord(key, { remark: e.target.value })}
                        />
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="k-bottom">
        <div className="k-card">
          <h3>今月のまとめ</h3>
          <dl className="k-stat-list">
            <div><dt>勤務日数</dt><dd>{monthWorkDays}日</dd></div>
            <div><dt>時間外労働</dt><dd>{minutesToLabel(monthOvertime)}</dd></div>
            <div><dt>36協定における時間外時間</dt><dd>{minutesToLabel(monthOvertime)}</dd></div>
            <div><dt>休日</dt><dd>{monthHolidays}日</dd></div>
            <div><dt>法定</dt><dd>{monthStatutoryHolidays}日</dd></div>
            <div><dt>有給取得日数</dt><dd>{monthLeaveDays}日</dd></div>
          </dl>
        </div>
        <div className="k-bottom-buttons">
          <button className="k-btn-secondary" onClick={() => setShowLeave(true)}>🗓 有給休暇</button>
          <button className="k-btn-secondary" onClick={() => setShowMemo(true)}>📝 メモ</button>
          <button className="k-settings-toggle" onClick={() => setShowSettings(true)}>⚙ 設定</button>
        </div>
      </div>

      {showLeave && (
        <div className="k-modal-overlay" onClick={() => setShowLeave(false)}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>有給休暇（{view.y}年）</h3>
              <button className="k-icon-btn" onClick={() => setShowLeave(false)}>✕</button>
            </div>
            <dl className="k-stat-list">
              <div><dt>付与日数</dt><dd>{settings.paidLeaveTotal}日</dd></div>
              <div><dt>取得日数</dt><dd>{leavesThisYear}日</dd></div>
              <div><dt className="k-highlight">残日数</dt><dd className="k-highlight">{leaveRemaining}日</dd></div>
            </dl>
            <div className="k-leave-add">
              <input type="date" value={leavePickDate} onChange={(e) => setLeavePickDate(e.target.value)} />
              <button className="k-btn-secondary" onClick={addLeave} disabled={!leavePickDate}>＋ 取得登録</button>
            </div>
            {leaveDatesThisYear.length > 0 && (
              <ul className="k-leave-dates">
                {leaveDatesThisYear.map((k) => {
                  const [y, m, d] = k.split("-").map(Number);
                  const seq = allLeaveDatesSorted.indexOf(k) + 1;
                  return (
                    <li key={k}>
                      <span>{m}月{d}日（{weekdayLabel(y, m, d)}）<span className="k-leave-seq">{seq}回目</span></span>
                      <button className="k-mini-btn" onClick={() => toggleLeave(k, false)} title="有休を取消">↺</button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </div>
      )}

      {showMemo && (
        <div className="k-modal-overlay" onClick={() => setShowMemo(false)}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>メモ・使用方法</h3>
              <button className="k-icon-btn" onClick={() => setShowMemo(false)}>✕</button>
            </div>
            <p className="k-memo-hint">出勤簿の使い方や注意点など、自由に書き留めておけます。</p>
            <textarea
              className="k-memo-textarea"
              value={memo}
              onChange={(e) => setMemo(e.target.value)}
              placeholder="ここにメモを入力…"
            />
          </div>
        </div>
      )}

      {showSettings && (
        <div className="k-modal-overlay" onClick={() => { setShowSettings(false); setConfirmReset(false); }}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>設定</h3>
              <button className="k-icon-btn" onClick={() => { setShowSettings(false); setConfirmReset(false); }}>✕</button>
            </div>
            <label className="k-field">
              所定労働時間
              <select value={settings.standardHours} onChange={(e) => setSettings((s) => ({ ...s, standardHours: Number(e.target.value) }))}>
                <option value="8">08:00</option>
                <option value="7.5">07:30</option>
                <option value="6.5">06:30</option>
                <option value="6">06:00</option>
              </select>
            </label>
            <label className="k-field">
              年間有給付与日数
              <input
                type="number" min="0" max="40" step="1"
                value={settings.paidLeaveTotal}
                onChange={(e) => setSettings((s) => ({ ...s, paidLeaveTotal: Number(e.target.value) || 0 }))}
              />
            </label>

            <div className="k-io-zone">
              <button className="k-btn-secondary-outline" onClick={handleExport}>⬇ データをエクスポート</button>
              <button className="k-btn-secondary-outline" onClick={() => fileInputRef.current && fileInputRef.current.click()}>⬆ データをインポート</button>
            </div>

            <div className="k-danger-zone">
              {!confirmReset ? (
                <button className="k-btn-danger" onClick={() => setConfirmReset(true)}>🗑 入力データをリセット</button>
              ) : (
                <div className="k-danger-confirm">
                  <p>すべての出退勤記録・業務内容・有給休暇の記録を削除します。この操作は元に戻せません。</p>
                  <div className="k-danger-confirm-buttons">
                    <button className="k-btn-danger" onClick={resetAllData}>削除する</button>
                    <button className="k-btn-secondary-outline" onClick={() => setConfirmReset(false)}>キャンセル</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KintaiApp />);
</script>
