<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出勤簿</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #e7eef4; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const dateKey = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const todayObj = () => {
  const n = new Date();
  return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() };
};
const hmNow = () => {
  const n = new Date();
  return `${pad(n.getHours())}:${pad(n.getMinutes())}`;
};
const toMinutes = (hm) => {
  if (!hm) return null;
  const [h, m] = hm.split(":").map(Number);
  return h * 60 + m;
};
const minutesToLabel = (mins) => {
  if (mins == null) return "―";
  const sign = mins < 0 ? "-" : "";
  mins = Math.abs(Math.round(mins));
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${sign}${h}時間${pad(m)}分`;
};
const breakMinutesFor = (worked) => {
  if (worked > 480) return 60;
  if (worked > 360) return 45;
  return 0;
};
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const weekdayLabel = (y, m, d) => ["日", "月", "火", "水", "木", "金", "土"][new Date(y, m - 1, d).getDay()];
const isWeekend = (y, m, d) => {
  const w = new Date(y, m - 1, d).getDay();
  return w === 0 || w === 6;
};
const monthLabel = (m) => ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"][m - 1];

const DEFAULT_WORK_TYPE_OPTIONS = ["", "保守", "泊", "明", "M1", "M2", "N朝", "NX", "C", "MA", "MX", "中継", "休日", "法定", "有給"];
const DEFAULT_HOLIDAY_TYPES = ["休日", "法定"];
const DEFAULT_AUTO_FILL_TIMES = {
  "泊": ["19:00", "02:30"],
  "明": ["02:30", "09:30"],
  "保守": ["09:30", "17:30"],
  "M1": ["09:30", "17:30"],
  "N朝": ["09:30", "17:30"],
  "MX": ["09:30", "17:30"],
  "NX": ["11:00", "19:00"],
  "C": ["11:00", "19:00"],
  "M2": ["11:00", "19:00"],
};
const SPECIAL_STANDARD_HOURS = 7.5;
const DEFAULT_SPECIAL_TYPES = [...Object.keys(DEFAULT_AUTO_FILL_TIMES), "中継"];
const LEAVE_COUNT_START = "2026-01-01";

const DEFAULT_SETTINGS = { standardHours: 8, paidLeaveTotal: 20 };
const STORAGE_KEY = "kintai-data-v1";
const BACKUP_KEY = "kintai-backups-v1"; // 世代バックアップの一覧
const CORRUPT_KEY = "kintai-data-v1-corrupt"; // 読み込みに失敗した保存データの退避先
const BACKUP_KEEP_DAYS = 7;
const BACKUP_MAX_COUNT = 30;
const NIGHT_NOTE = "泊"; // 「泊」の翌日は「明」になる勤務パターン
const AFTER_NIGHT_NOTE = "明";
const BULK_CLEAR = "__clear__"; // 一括入力で「空にする」を選んだときの値
// 時間外の上限(36協定の一般的な基準)。上限の LIMIT_WARN_RATIO 以上で注意、超えたら超過として表示する
const LIMIT_MONTH_OT_HOURS = 45;
const LIMIT_MONTH_TOTAL_HOURS = 100; // 時間外+休日労働(月100時間未満)
const LIMIT_YEAR_OT_HOURS = 360;
const LIMIT_WARN_RATIO = 0.8;

// minimal CSV line splitter (no quoted-comma support needed for our simple sheets)
const parseCsvText = (text) => {
  const lines = text.replace(/\r/g, "").split("\n").filter((l) => l.length > 0);
  return lines.map((l) => l.split(","));
};

const normalizeTimeStr = (s) => {
  s = (s || "").trim();
  if (!s) return "";
  if (s.includes(":")) {
    const [h, m] = s.split(":");
    if (/^\d+$/.test(h) && /^\d+$/.test(m)) return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    return s;
  }
  if (/^\d{4}$/.test(s)) return `${s.slice(0, 2)}:${s.slice(2)}`;
  if (/^\d{1,2}$/.test(s)) return `${String(s).padStart(2, "0")}:00`;
  return s;
};

// 日付文字列を YYYY-MM-DD に揃える(2026-9-19 / 2026/9/19 / 2026.9.19 に対応)。解釈できなければ空文字。
const normalizeDateStr = (s) => {
  const m = (s || "").trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  return m ? dateKey(Number(m[1]), Number(m[2]), Number(m[3])) : "";
};

// CSVを文字コード自動判定で読み込む(UTF-8で読めなければShift-JIS)。BOMは取り除く。
const readCsvText = (file, onText) => {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const buf = ev.target.result;
    let text;
    try {
      text = new TextDecoder("utf-8", { fatal: true }).decode(buf);
    } catch (e) {
      text = new TextDecoder("shift_jis").decode(buf);
    }
    onText(text.replace(/^﻿/, ""));
  };
  reader.readAsArrayBuffer(file);
};

// window.storage only exists inside Claude.ai's artifact runtime. When this file is opened
// directly in a browser (double-clicked, or hosted elsewhere), fall back to localStorage so
// data still persists between visits instead of resetting empty every time.
// Persist the File System Access API handle in IndexedDB so it survives page reloads.
// (showSaveFilePicker's handle only lives in memory otherwise, forcing the user to
// re-pick a save location every time the page refreshes.)
const fileHandleStore = {
  DB_NAME: "kintai-file-handles",
  STORE_NAME: "handles",
  KEY: "export-handle",

  _openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(this.STORE_NAME);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async save(handle) {
    try {
      const db = await this._openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(this.STORE_NAME, "readwrite");
        tx.objectStore(this.STORE_NAME).put(handle, this.KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      // IndexedDB unavailable — the handle just won't survive a reload
    }
  },

  async load() {
    try {
      const db = await this._openDb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(this.STORE_NAME, "readonly");
        const req = tx.objectStore(this.STORE_NAME).get(this.KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      return null;
    }
  },
};

const storageAdapter = {
  async get(key) {
    if (window.storage && typeof window.storage.get === "function") {
      try {
        const res = await window.storage.get(key, false);
        if (res) return res;
      } catch (e) {
        // fall through to localStorage
      }
    }
    try {
      const v = localStorage.getItem(key);
      return v ? { value: v } : null;
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    if (window.storage && typeof window.storage.set === "function") {
      try {
        await window.storage.set(key, value, false);
        return true;
      } catch (e) {
        // fall through to localStorage
      }
    }
    try {
      localStorage.setItem(key, value);
      return true;
    } catch (e) {
      // storage unavailable (e.g. private browsing) — 保存できなかったことを呼び出し側へ返す
      return false;
    }
  },
};

const downloadJsonFile = (data, filename) => {
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// YYYY-MM-DD の日付キーを delta 日ずらす(月をまたいでもよい)
const shiftDateKey = (key, delta) => {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return dateKey(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
};

const limitLevelOf = (mins, limitHours) => {
  const ratio = mins / (limitHours * 60);
  return ratio > 1 ? "over" : ratio >= LIMIT_WARN_RATIO ? "warn" : "ok";
};

// 上限に対する進み具合を、数値とバーで表示する
function LimitMeter({ label, mins, limitHours }) {
  const level = limitLevelOf(mins, limitHours);
  const ratio = mins / (limitHours * 60);
  return (
    <div className="k-limit-item">
      <div className="k-limit-head">
        <span>{label}</span>
        <span className={`k-limit-val k-limit-${level}`}>
          {level === "over" ? "⚠ 超過 " : level === "warn" ? "⚠ " : ""}
          {minutesToLabel(mins)} / {limitHours}時間
        </span>
      </div>
      <div className="k-limit-bar">
        <div className={`k-limit-fill k-limit-${level}`} style={{ width: `${Math.min(100, ratio * 100)}%` }} />
      </div>
    </div>
  );
}

function KintaiApp() {
  const [loaded, setLoaded] = useState(false);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [records, setRecords] = useState({}); // dateKey -> {clockIn, clockOut, isLeave, note, remark, otStart, otEnd, locked}
  const [memo, setMemo] = useState("");
  const [workTypeOptions, setWorkTypeOptions] = useState(DEFAULT_WORK_TYPE_OPTIONS);
  const [autoFillTimes, setAutoFillTimes] = useState(DEFAULT_AUTO_FILL_TIMES);
  const [holidayTypes, setHolidayTypes] = useState(DEFAULT_HOLIDAY_TYPES);
  const [specialTypes, setSpecialTypes] = useState(DEFAULT_SPECIAL_TYPES);
  const workTypeFileRef = useRef(null);
  const ledgerCsvFileRef = useRef(null);
  const [view, setView] = useState(() => {
    const t = todayObj();
    return { y: t.y, m: t.m };
  });
  const [showSettings, setShowSettings] = useState(false);
  const [showLeave, setShowLeave] = useState(false);
  const [showMemo, setShowMemo] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [importPromptDismissed, setImportPromptDismissed] = useState(false);
  const [leavePickDate, setLeavePickDate] = useState("");
  const [clock, setClock] = useState(hmNow());
  const [zoom, setZoom] = useState(1);
  const saveTimer = useRef(null);
  const fileInputRef = useRef(null);
  const fileHandleRef = useRef(null);
  const [needsFilePermission, setNeedsFilePermission] = useState(false);
  const [savedFileName, setSavedFileName] = useState("");
  const [backups, setBackups] = useState([]); // [{ at, day, reason, data }] 新しい順
  const [loadError, setLoadError] = useState(false); // 保存データの読み込みに失敗したら自動保存を止める
  const backupsRef = useRef([]);
  const lastFileDataRef = useRef(""); // 最後にファイルへ書き込んだ内容(変わっていなければ書き込まない)
  const rootRef = useRef(null);
  const [saveState, setSaveState] = useState(""); // "" | "saving" | "saved" | "error"
  const [savedAt, setSavedAt] = useState(""); // ブラウザ内への最終保存時刻
  const [fileSavedAt, setFileSavedAt] = useState(""); // JSONファイルへの最終保存時刻
  const [bulkMode, setBulkMode] = useState(false); // 一括入力パネルの表示
  const [bulkSel, setBulkSel] = useState({}); // 一括入力で選択中の日 (dateKey -> true)
  const [bulkNote, setBulkNote] = useState(""); // 一括入力する業務内容("" は未選択)
  const [bulkAddAfter, setBulkAddAfter] = useState(true); // 「泊」を入れた翌日に「明」も入れる
  const [bulkMsg, setBulkMsg] = useState("");
  const [suggestion, setSuggestion] = useState(null); // 「泊」の翌日を「明」にする提案 { key, note }

  const today = todayObj();
  const todayKey = dateKey(today.y, today.m, today.d);

  // 世代バックアップを1件追加する。直近BACKUP_KEEP_DAYS日分だけ残す。
  // oncePerDay が true なら、同じ日・同じ理由のバックアップが既にあれば何もしない。
  const addBackup = async (reason, data, oncePerDay = false) => {
    const t = todayObj();
    const day = dateKey(t.y, t.m, t.d);
    const list = backupsRef.current;
    if (oncePerDay && list.some((b) => b.day === day && b.reason === reason)) return;
    const limit = new Date();
    limit.setDate(limit.getDate() - BACKUP_KEEP_DAYS);
    const oldest = dateKey(limit.getFullYear(), limit.getMonth() + 1, limit.getDate());
    const next = [{ at: `${day} ${hmNow()}`, day, reason, data }, ...list]
      .filter((b) => b.day >= oldest)
      .slice(0, BACKUP_MAX_COUNT);
    backupsRef.current = next;
    setBackups(next);
    await storageAdapter.set(BACKUP_KEY, JSON.stringify(next));
  };

  useEffect(() => {
    const id = setInterval(() => setClock(hmNow()), 1000 * 15);
    return () => clearInterval(id);
  }, []);

  // 提案は一定時間で自動的に閉じる
  useEffect(() => {
    if (!suggestion) return;
    const id = setTimeout(() => setSuggestion(null), 12000);
    return () => clearTimeout(id);
  }, [suggestion]);

  // 起動時に今日の行が見える位置までスクロールする
  useEffect(() => {
    if (!loaded) return;
    const el = document.getElementById(`row-${todayKey}`);
    if (!el) return;
    const wrap = el.closest(".k-table-wrap");
    if (wrap && wrap.scrollHeight > wrap.clientHeight) {
      // PC: 表の中だけをスクロールする(ページ全体は動かさない)
      wrap.scrollTop = el.offsetTop - wrap.clientHeight / 2 + el.offsetHeight / 2;
    } else {
      // スマホ: 表が縦に伸びているので、ページ全体をスクロールする
      el.scrollIntoView({ block: "center" });
    }
  }, [loaded]);

  // Ctrl+ホイールで画面をズームする。ReactのonWheelはpassiveでpreventDefaultが効かず、
  // ブラウザ標準のズームと二重に効いてしまうため、passive:falseで直接登録する。
  useEffect(() => {
    const el = rootRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      setZoom((z) => {
        const next = z + (e.deltaY < 0 ? 0.1 : -0.1);
        return Math.min(1.6, Math.max(0.7, Math.round(next * 100) / 100));
      });
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [loaded]);

  useEffect(() => {
    (async () => {
      let raw = null;
      try {
        // バックアップ一覧は、最初の自動保存で上書きしてしまわないよう先に読み込む
        try {
          const bk = await storageAdapter.get(BACKUP_KEY);
          const list = bk && bk.value ? JSON.parse(bk.value) : [];
          if (Array.isArray(list)) {
            backupsRef.current = list;
            setBackups(list);
          }
        } catch (e) {
          // バックアップ一覧が壊れていても本体の読み込みは続ける
        }
        const res = await storageAdapter.get(STORAGE_KEY);
        if (res && res.value) {
          raw = res.value;
          const parsed = JSON.parse(raw);
          setSettings({ ...DEFAULT_SETTINGS, ...(parsed.settings || {}) });
          setRecords(parsed.records || {});
          setMemo(parsed.memo || "");
          if (parsed.workTypeOptions) setWorkTypeOptions(parsed.workTypeOptions);
          if (parsed.autoFillTimes) setAutoFillTimes(parsed.autoFillTimes);
          if (parsed.holidayTypes) setHolidayTypes(parsed.holidayTypes);
          if (parsed.specialTypes) setSpecialTypes(parsed.specialTypes);
        }
      } catch (e) {
        // 壊れたデータを空データで上書きしないよう、別キーへ退避して自動保存を止める
        setLoadError(true);
        if (raw != null) {
          try { await storageAdapter.set(CORRUPT_KEY, raw); } catch (e2) { /* 退避に失敗しても続行 */ }
        }
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded || loadError) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const json = JSON.stringify({
          settings, records, memo, workTypeOptions, autoFillTimes, holidayTypes, specialTypes,
        });
        const ok = await storageAdapter.set(STORAGE_KEY, json);
        if (!ok) {
          setSaveState("error");
          return;
        }
        setSavedAt(hmNow());
        setSaveState("saved");
        // 1日1回、その日の最初の保存内容(=前日までの状態)を世代バックアップとして残す
        if (Object.keys(records).length) await addBackup("自動", json, true);
      } catch (e) {
        setSaveState("error");
        console.error("保存に失敗しました", e);
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [settings, records, memo, workTypeOptions, autoFillTimes, holidayTypes, specialTypes, loaded, loadError]);

  const settingsRef = useRef(settings);
  const recordsRef = useRef(records);
  const memoRef = useRef(memo);
  useEffect(() => { settingsRef.current = settings; }, [settings]);
  useEffect(() => { recordsRef.current = records; }, [records]);
  useEffect(() => { memoRef.current = memo; }, [memo]);

  // restore a previously chosen save-file handle so "JSON保存" keeps overwriting
  // the same file across page reloads, instead of asking to pick it again every time
  useEffect(() => {
    if (!window.showSaveFilePicker) return;
    (async () => {
      const handle = await fileHandleStore.load();
      if (!handle) return;
      try {
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted") {
          fileHandleRef.current = handle;
          setSavedFileName(handle.name || "");
        } else {
          // permission needs a user gesture to re-grant, but the file itself
          // doesn't need to be re-picked — offer a one-click re-grant instead
          fileHandleRef.current = handle;
          setSavedFileName(handle.name || "");
          setNeedsFilePermission(true);
        }
      } catch (e) {
        // handle is stale/unusable — fall back to picking a new file next time
      }
    })();
  }, []);

  const reauthorizeFile = async () => {
    if (!fileHandleRef.current) return;
    try {
      const perm = await fileHandleRef.current.requestPermission({ mode: "readwrite" });
      if (perm === "granted") setNeedsFilePermission(false);
    } catch (e) {
      // user declined — leave the banner up so they can try again
    }
  };

  useEffect(() => {
    if (!loaded || loadError) return;
    const id = setInterval(async () => {
      if (!fileHandleRef.current) return;
      // 記録が空のときは書き込まない(リセットや読み込み失敗で、ファイル側のバックアップまで空にしないため)
      if (!Object.keys(recordsRef.current).length) return;
      const data = JSON.stringify(
        {
          settings: settingsRef.current, records: recordsRef.current, memo: memoRef.current,
          workTypeOptions, autoFillTimes, holidayTypes, specialTypes,
        }, null, 2
      );
      // 前回書き込んだ内容から変わっていなければ書き込まない
      if (data === lastFileDataRef.current) return;
      try {
        const writable = await fileHandleRef.current.createWritable();
        await writable.write(data);
        await writable.close();
        lastFileDataRef.current = data;
        setFileSavedAt(hmNow());
      } catch (e) {
        setNeedsFilePermission(true);
      }
    }, 60 * 1000);
    return () => clearInterval(id);
  }, [loaded, loadError, workTypeOptions, autoFillTimes, holidayTypes, specialTypes]);

  const updateRecord = useCallback((key, patch) => {
    setRecords((prev) => {
      const current = prev[key] || { clockIn: null, clockOut: null, isLeave: false, note: "", remark: "", otStart: null, otEnd: null, locked: false };
      if (current.locked && !("locked" in patch)) return prev; // day is locked; ignore edits
      return { ...prev, [key]: { ...current, ...patch } };
    });
  }, []);

  const standardHoursFor = (rec) => {
    const note = rec.note || "";
    if (holidayTypes.includes(note)) return 0;
    if (specialTypes.includes(note)) return SPECIAL_STANDARD_HOURS;
    return settings.standardHours;
  };

  const autoOvertimeMinutesFor = (rec) => {
    if (!rec || rec.isLeave) return 0;
    const inM = toMinutes(rec.clockIn);
    let outM = toMinutes(rec.clockOut);
    if (inM == null || outM == null) return 0;
    if (outM <= inM) outM += 24 * 60;
    const worked = outM - inM - breakMinutesFor(outM - inM);
    return Math.max(0, worked - standardHoursFor(rec) * 60);
  };

  const overtimeMinutesFor = (rec) => {
    if (!rec || rec.isLeave) return 0;
    if (rec.otStart && rec.otEnd) {
      const s = toMinutes(rec.otStart);
      let e = toMinutes(rec.otEnd);
      if (s != null && e != null) {
        if (e <= s) e += 24 * 60;
        return Math.max(0, e - s);
      }
    }
    return autoOvertimeMinutesFor(rec);
  };

  const dim = daysInMonth(view.y, view.m);
  const dayList = Array.from({ length: dim }, (_, i) => i + 1);

  let monthOvertime = 0; // 時間外労働(法定休日の労働は含めない)
  let monthStatutoryWork = 0; // 法定休日労働
  let monthWorkDays = 0;
  let monthHolidays = 0;
  let monthStatutoryHolidays = 0;
  let monthLeaveDays = 0;
  dayList.forEach((d) => {
    const rec = records[dateKey(view.y, view.m, d)];
    if (!rec) return;
    if (rec.note === "法定") monthStatutoryWork += overtimeMinutesFor(rec);
    else monthOvertime += overtimeMinutesFor(rec);
    if (rec.clockIn && rec.clockOut && !rec.isLeave) monthWorkDays += 1;
    if (rec.note === "休日") monthHolidays += 1;
    if (rec.note === "法定") monthStatutoryHolidays += 1;
    if (rec.isLeave) monthLeaveDays += 1;
  });

  // 表示中の年の時間外労働(法定休日の労働は除く)
  let yearOvertime = 0;
  Object.keys(records).forEach((k) => {
    if (!k.startsWith(`${view.y}-`) || records[k].note === "法定") return;
    yearOvertime += overtimeMinutesFor(records[k]);
  });

  const limitChecks = [
    { label: "今月の時間外労働", mins: monthOvertime, limitHours: LIMIT_MONTH_OT_HOURS },
    { label: "今月の時間外+休日労働", mins: monthOvertime + monthStatutoryWork, limitHours: LIMIT_MONTH_TOTAL_HOURS },
    { label: `${view.y}年の時間外労働`, mins: yearOvertime, limitHours: LIMIT_YEAR_OT_HOURS },
  ];
  const limitAlerts = limitChecks.filter((c) => limitLevelOf(c.mins, c.limitHours) !== "ok");

  const allLeaveDatesSorted = Object.keys(records)
    .filter((k) => records[k].isLeave && k >= LEAVE_COUNT_START)
    .sort();
  const leaveDatesThisYear = Object.keys(records)
    .filter((k) => records[k].isLeave && k.startsWith(`${view.y}-`))
    .sort();
  const leavesThisYear = leaveDatesThisYear.length;
  const leaveRemaining = settings.paidLeaveTotal - leavesThisYear;
  const isEmpty = Object.keys(records).length === 0;

  const changeMonth = (delta) => {
    let m = view.m + delta;
    let y = view.y;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1) { m = 12; y -= 1; }
    setView({ y, m });
    setBulkSel({}); // 別の月の選択が残らないようにする
    setBulkMsg("");
  };

  const jumpToDate = (key) => {
    const el = document.getElementById(`row-${key}`);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("k-row-flash");
    setTimeout(() => el.classList.remove("k-row-flash"), 1200);
  };

  const onNoteChange = (key, val) => {
    const patch = { note: val, remark: val, isLeave: val === "有給" };
    if (val in autoFillTimes) {
      const [ci, co] = autoFillTimes[val];
      patch.clockIn = ci;
      patch.clockOut = co;
    } else if (val === "" || holidayTypes.includes(val) || val === "有給" || val === "中継") {
      patch.clockIn = null;
      patch.clockOut = null;
    }
    updateRecord(key, patch);
  };

  const toggleLeave = (key, isLeave) => {
    if (isLeave) updateRecord(key, { isLeave: true, clockIn: null, clockOut: null, note: "有給", remark: "有給" });
    else updateRecord(key, { isLeave: false, note: "", remark: "" });
  };

  const toggleDayLock = (key) => {
    const current = records[key] || { locked: false };
    updateRecord(key, { locked: !current.locked });
  };

  const addLeave = () => {
    if (!leavePickDate) return;
    updateRecord(leavePickDate, { isLeave: true, clockIn: null, clockOut: null, note: "有給", remark: "有給" });
    setLeavePickDate("");
  };

  // 現在時刻を今日の出勤/退勤として記録する
  const punch = (field) => {
    const label = field === "clockIn" ? "出勤" : "退勤";
    const rec = records[todayKey] || {};
    if (rec.locked) { alert("今日の行はロック中です。"); return; }
    if (rec.isLeave) { alert("今日は有給として登録されています。"); return; }
    const now = hmNow();
    if (rec[field] && !window.confirm(`すでに${label}が ${rec[field]} で入力されています。${now} に上書きしますか？`)) return;
    updateRecord(todayKey, { [field]: now });
    // 別の月を表示中なら今月へ戻し、入力結果が見えるように今日の行へ移動する
    if (view.y !== today.y || view.m !== today.m) setView({ y: today.y, m: today.m });
    setTimeout(() => jumpToDate(todayKey), 100);
  };

  // 破壊的な操作(リセット・インポート・復元)の直前に、現在の内容を退避する。
  // 記録が空なら失うものが無いので何もしない。
  const backupNow = (reason) => {
    if (!Object.keys(records).length) return;
    addBackup(reason, JSON.stringify({
      settings, records, memo, workTypeOptions, autoFillTimes, holidayTypes, specialTypes,
    }));
  };

  // ---- 一括入力 ----
  const monthPrefix = `${view.y}-${pad(view.m)}-`;
  const selectedKeys = Object.keys(bulkSel).filter((k) => bulkSel[k] && k.startsWith(monthPrefix)).sort();

  const toggleBulkMode = () => {
    setBulkMode((on) => !on);
    setBulkSel({});
    setBulkMsg("");
  };

  const toggleSelect = (key) => {
    setBulkSel((prev) => {
      const next = { ...prev };
      if (next[key]) delete next[key];
      else next[key] = true;
      return next;
    });
  };

  // 条件に合う日(日付の数字で判定)を選択に加える
  const selectDays = (pred) => {
    const next = { ...bulkSel };
    dayList.forEach((d) => { if (pred(d)) next[dateKey(view.y, view.m, d)] = true; });
    setBulkSel(next);
  };

  // 選択した日に、選んだ業務内容をまとめて入力する(ロック中の日は飛ばす)
  const applyBulk = () => {
    if (!bulkNote || !selectedKeys.length) return;
    const note = bulkNote === BULK_CLEAR ? "" : bulkNote;
    const targets = selectedKeys.filter((k) => !(records[k] || {}).locked);
    const lockedCount = selectedKeys.length - targets.length;
    // すでに入力のある日(出退勤や別の業務内容)を上書きする場合は確認する
    const overwriting = targets.filter((k) => {
      const r = records[k] || {};
      return (r.note && r.note !== note) || r.clockIn || r.clockOut;
    });
    if (overwriting.length && !window.confirm(`入力済みの ${overwriting.length}日 を上書きします。よろしいですか？`)) return;

    backupNow("一括入力前");
    let afterCount = 0;
    targets.forEach((key) => {
      onNoteChange(key, note);
      if (note !== NIGHT_NOTE || !bulkAddAfter || !workTypeOptions.includes(AFTER_NIGHT_NOTE)) return;
      // 「泊」の翌日が未入力・ロックなし・選択外のときだけ「明」を入れる
      const nextKey = shiftDateKey(key, 1);
      const next = records[nextKey] || {};
      if (bulkSel[nextKey] || next.locked || next.note) return;
      onNoteChange(nextKey, AFTER_NIGHT_NOTE);
      afterCount += 1;
    });
    setBulkMsg(
      `${targets.length}日に「${note || "空"}」を入力しました。` +
      (afterCount ? `翌日の「${AFTER_NIGHT_NOTE}」を${afterCount}日入力しました。` : "") +
      (lockedCount ? `ロック中の${lockedCount}日は飛ばしました。` : "")
    );
    setBulkSel({});
  };

  // 前月の同じ日付の業務内容を、今月の未入力の日へコピーする(出退勤時刻は業務内容の自動入力に従う)
  const prevMonth = view.m === 1 ? 12 : view.m - 1;
  const prevYear = view.m === 1 ? view.y - 1 : view.y;
  const copyPrevMonth = () => {
    const prevDim = daysInMonth(prevYear, prevMonth);
    const targets = [];
    dayList.forEach((d) => {
      if (d > prevDim) return;
      const key = dateKey(view.y, view.m, d);
      const cur = records[key] || {};
      if (cur.locked || cur.note || cur.clockIn || cur.clockOut) return; // 入力済み・ロック中は上書きしない
      const src = records[dateKey(prevYear, prevMonth, d)];
      if (!src || !src.note || src.note === "有給") return; // 有給は前月のものをコピーしない
      targets.push([key, src.note]);
    });
    if (!targets.length) {
      setBulkMsg("コピーできる日がありません(前月に業務内容の入力が無いか、今月がすでに入力済みです)。");
      return;
    }
    if (!window.confirm(`${prevYear}年${prevMonth}月の業務内容を、${view.m}月の未入力の日 ${targets.length}日にコピーします。よろしいですか？`)) return;
    backupNow("前月コピー前");
    targets.forEach(([key, note]) => onNoteChange(key, note));
    setBulkMsg(`${prevMonth}月のパターンを${targets.length}日分コピーしました。`);
  };

  // 表の業務内容を「泊」にしたとき、翌日が未入力なら「明」にする提案を出す
  const suggestAfterNight = (key, val) => {
    const next = records[shiftDateKey(key, 1)] || {};
    if (val !== NIGHT_NOTE || !workTypeOptions.includes(AFTER_NIGHT_NOTE) || next.locked || next.note) {
      setSuggestion(null);
      return;
    }
    setSuggestion({ key: shiftDateKey(key, 1), note: AFTER_NIGHT_NOTE });
  };

  const acceptSuggestion = () => {
    if (!suggestion) return;
    onNoteChange(suggestion.key, suggestion.note);
    setSuggestion(null);
  };

  const resetAllData = () => {
    backupNow("リセット前");
    setRecords({});
    setConfirmReset(false);
  };

  const handleExport = async () => {
    const data = JSON.stringify({ settings, records, memo, workTypeOptions, autoFillTimes, holidayTypes, specialTypes }, null, 2);
    try {
      if (window.showSaveFilePicker) {
        if (!fileHandleRef.current || needsFilePermission) {
          fileHandleRef.current = await window.showSaveFilePicker({
            suggestedName: `kintai-data-${todayKey}.json`,
            types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
          });
          await fileHandleStore.save(fileHandleRef.current);
          setSavedFileName(fileHandleRef.current.name || "");
          setNeedsFilePermission(false);
        }
        const writable = await fileHandleRef.current.createWritable();
        await writable.write(data);
        await writable.close();
        lastFileDataRef.current = data;
        setFileSavedAt(hmNow());
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
      fileHandleRef.current = null;
    }
    downloadJsonFile(data, `kintai-data-${todayKey}.json`);
  };

  // JSONの内容を画面の状態へ反映する(インポート・バックアップ復元で共通)
  const applyData = (parsed) => {
    setSettings({ ...DEFAULT_SETTINGS, ...(parsed.settings || {}) });
    setRecords(parsed.records || {});
    setMemo(parsed.memo || "");
    if (parsed.workTypeOptions) setWorkTypeOptions(parsed.workTypeOptions);
    if (parsed.autoFillTimes) setAutoFillTimes(parsed.autoFillTimes);
    if (parsed.holidayTypes) setHolidayTypes(parsed.holidayTypes);
    if (parsed.specialTypes) setSpecialTypes(parsed.specialTypes);
    setLoadError(false); // 正しいデータが入ったので自動保存を再開する
  };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed || typeof parsed !== "object") throw new Error("invalid");
        backupNow("インポート前");
        applyData(parsed);
      } catch (err) {
        alert("ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const restoreBackup = (b) => {
    if (!window.confirm(`${b.at}(${b.reason})の状態に復元します。現在の内容は「復元前」として退避されます。よろしいですか？`)) return;
    try {
      const parsed = JSON.parse(b.data);
      backupNow("復元前");
      applyData(parsed);
    } catch (err) {
      alert("バックアップの復元に失敗しました。");
    }
  };

  // 業務内容,出勤,退勤,作業時間(または区分) の列を持つCSVから、業務内容の自動入力ルールを
  // 完全に同期する(CSVに無い項目は選択肢から削除される)。技術戦略部勤務.csv等と同じ考え方。
  const handleWorkTypeCsv = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    readCsvText(file, (text) => {
      try {
        const rows = parseCsvText(text);
        if (!rows.length) throw new Error("空のファイルです");
        const header = rows[0].map((c) => c.trim());
        const noteIdx = header.indexOf("業務内容");
        if (noteIdx === -1) throw new Error("「業務内容」列が見つかりません");
        const inIdx = header.indexOf("出勤");
        const outIdx = header.indexOf("退勤");
        const kindIdx = header.indexOf("区分");
        const workHoursIdx = header.indexOf("作業時間");
        const HOLIDAY_HINTS = ["休日", "法定", "祝日"];

        const options = [];
        const newAutoFill = {};
        const newHoliday = new Set();
        const newSpecial = new Set();
        const seen = new Set();

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const note = (row[noteIdx] || "").trim();
          if (!note) continue;
          if (!seen.has(note)) { seen.add(note); options.push(note); }

          const ci = inIdx >= 0 ? normalizeTimeStr(row[inIdx]) : "";
          const co = outIdx >= 0 ? normalizeTimeStr(row[outIdx]) : "";
          if (ci && co) newAutoFill[note] = [ci, co];

          if (HOLIDAY_HINTS.includes(note)) {
            newHoliday.add(note);
            continue;
          }
          if (kindIdx >= 0) {
            const kind = (row[kindIdx] || "").trim();
            if (HOLIDAY_HINTS.includes(kind)) newHoliday.add(note);
            else if (kind === "特別" || kind === "特") newSpecial.add(note);
          } else if (workHoursIdx >= 0) {
            if ((row[workHoursIdx] || "").trim()) newSpecial.add(note);
          }
        }

        if (!options.length) throw new Error("取り込めるデータが見つかりませんでした");

        const removed = workTypeOptions.filter((v) => v && !options.includes(v));
        setWorkTypeOptions(["", ...options]);
        setAutoFillTimes(newAutoFill);
        setHolidayTypes([...newHoliday]);
        setSpecialTypes([...newSpecial]);

        alert(
          `業務内容の設定を更新しました。\n項目数: ${options.length}\n削除された項目: ${removed.join("、") || "なし"}`
        );
      } catch (err) {
        alert("CSVの読み込みに失敗しました: " + err.message);
      }
    });
    e.target.value = "";
  };

  // 日付,業務内容,出勤,退勤,作業時間,備考 の列を持つCSVから、日々の出勤簿データを取り込む。
  // 「作業時間」列は自動計算されるため参考情報として無視する。
  const handleLedgerCsv = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    readCsvText(file, (text) => {
      try {
        const rows = parseCsvText(text);
        if (!rows.length) throw new Error("空のファイルです");
        const header = rows[0].map((c) => c.trim());
        const dateIdx = header.indexOf("日付");
        if (dateIdx === -1) throw new Error("「日付」列が見つかりません");
        const noteIdx = header.indexOf("業務内容");
        const inIdx = header.indexOf("出勤");
        const outIdx = header.indexOf("退勤");
        const remarkIdx = header.indexOf("備考");

        let count = 0;
        setRecords((prev) => {
          const next = { ...prev };
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const dateStr = normalizeDateStr(row[dateIdx]);
            if (!dateStr) continue;

            const note = noteIdx >= 0 ? (row[noteIdx] || "").trim() : "";
            const ci = inIdx >= 0 ? normalizeTimeStr(row[inIdx]) : "";
            const co = outIdx >= 0 ? normalizeTimeStr(row[outIdx]) : "";
            const remark = remarkIdx >= 0 ? (row[remarkIdx] || "").trim() : "";

            const current = next[dateStr] || { clockIn: null, clockOut: null, isLeave: false, note: "", remark: "", otStart: null, otEnd: null, locked: false };
            if (current.locked) continue;
            const patch = {};
            if (note) {
              patch.note = note;
              patch.remark = remark || note;
              patch.isLeave = note === "有給"; // 画面で選んだときと同じく、有給は有給日数に数える
              if (patch.isLeave) { patch.clockIn = null; patch.clockOut = null; }
            } else if (remark) patch.remark = remark;
            if (ci) patch.clockIn = ci;
            if (co) patch.clockOut = co;
            if (note in autoFillTimes && !ci && !co) {
              const [aci, aco] = autoFillTimes[note];
              patch.clockIn = aci;
              patch.clockOut = aco;
            }
            if (Object.keys(patch).length) {
              next[dateStr] = { ...current, ...patch };
              count += 1;
            }
          }
          return next;
        });
        setTimeout(() => alert(`${count}日分のデータを取り込みました。`), 0);
      } catch (err) {
        alert("CSVの読み込みに失敗しました: " + err.message);
      }
    });
    e.target.value = "";
  };

  if (!loaded) {
    return <div className="kintai-root kintai-loading">読み込み中…</div>;
  }

  const todayRec = records[todayKey] || {};
  const saveLabel = loadError ? "自動保存: 停止中"
    : saveState === "saving" ? "保存中…"
    : saveState === "error" ? "⚠ 保存に失敗しました"
    : saveState === "saved" ? `✓ 保存しました ${savedAt}`
    : "";
  const saveStatusText = saveLabel + (fileSavedAt && !loadError ? `／ ファイル ${fileSavedAt}` : "");

  return (
    <div ref={rootRef} className="kintai-root" style={{ zoom: zoom }}>
      <input
        ref={fileInputRef}
        type="file"
        accept="application/json"
        style={{ display: "none" }}
        onChange={handleImportFile}
      />
      <input
        ref={workTypeFileRef}
        type="file"
        accept=".csv,text/csv"
        style={{ display: "none" }}
        onChange={handleWorkTypeCsv}
      />
      <input
        ref={ledgerCsvFileRef}
        type="file"
        accept=".csv,text/csv"
        style={{ display: "none" }}
        onChange={handleLedgerCsv}
      />

      <header className="k-header">
        <div className="k-header-left">
          <span className="k-eyebrow">個人勤怠記録</span>
          <h1>出勤簿</h1>
        </div>
        <div className="k-header-right">
          <div className="k-header-btn-row">
            <button className="k-header-export" onClick={handleExport}>⬇ JSON保存</button>
            <button className="k-header-export" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              ⬆ データをインポート
            </button>
          </div>
          <div className="k-clock">{clock}</div>
          <div className="k-date">
            {today.y}年{today.m}月{today.d}日（{weekdayLabel(today.y, today.m, today.d)}）
          </div>
          <div className="k-punch-row">
            <button className="k-punch-btn k-punch-in" onClick={() => punch("clockIn")} title="現在時刻を今日の出勤に入力">
              出勤{todayRec.clockIn ? ` ${todayRec.clockIn}` : ""}
            </button>
            <button className="k-punch-btn k-punch-out" onClick={() => punch("clockOut")} title="現在時刻を今日の退勤に入力">
              退勤{todayRec.clockOut ? ` ${todayRec.clockOut}` : ""}
            </button>
          </div>
          <div className={`k-save-status ${saveState === "error" || loadError ? "k-save-status-error" : ""}`}>
            {saveStatusText}
          </div>
        </div>
      </header>

      {loadError && (
        <div className="k-import-banner">
          <span>保存データの読み込みに失敗したため、自動保存を停止しています(破損データは別領域に退避済み)。バックアップのJSONをインポートするか、設定の「バックアップ」から復元してください。</span>
          <div className="k-import-banner-buttons">
            <button className="k-btn-secondary" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              ⬆ インポート
            </button>
            <button className="k-btn-secondary-outline" onClick={() => setLoadError(false)}>
              空で開始
            </button>
          </div>
        </div>
      )}

      {isEmpty && !importPromptDismissed && !loadError && (
        <div className="k-import-banner">
          <span>記録がまだありません。バックアップのJSONファイルがあればインポートできます。</span>
          <div className="k-import-banner-buttons">
            <button className="k-btn-secondary" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              ⬆ インポート
            </button>
            <button className="k-btn-secondary-outline" onClick={() => setImportPromptDismissed(true)}>
              スキップ
            </button>
          </div>
        </div>
      )}

      {needsFilePermission && (
        <div className="k-import-banner">
          <span>保存先ファイル「{savedFileName}」への書き込み許可が必要です(ファイルの選び直しは不要です)。</span>
          <div className="k-import-banner-buttons">
            <button className="k-btn-secondary" onClick={reauthorizeFile}>🔓 許可する</button>
          </div>
        </div>
      )}

      <div className="k-ledger">
        <div className="k-ledger-head">
          <button className="k-nav" onClick={() => changeMonth(-1)}>‹</button>
          <h2>{view.y}年 {monthLabel(view.m)}</h2>
          <button className="k-nav" onClick={() => changeMonth(1)}>›</button>
        </div>

        {limitAlerts.length > 0 && (
          <div className="k-limit-alerts">
            {limitAlerts.map((c) => {
              const level = limitLevelOf(c.mins, c.limitHours);
              const pct = Math.round((c.mins / (c.limitHours * 60)) * 100);
              return (
                <div key={c.label} className={`k-limit-alert k-limit-alert-${level}`}>
                  ⚠ {c.label} {minutesToLabel(c.mins)} / {c.limitHours}時間（{pct}%）{level === "over" ? " 上限を超えています" : " 上限に近づいています"}
                </div>
              );
            })}
          </div>
        )}

        <div className="k-bulk-bar">
          <button className={`k-bulk-toggle ${bulkMode ? "k-bulk-toggle-on" : ""}`} onClick={toggleBulkMode}>
            ☑ 一括入力{bulkMode ? "を終了" : ""}
          </button>
        </div>

        {bulkMode && (
          <div className="k-bulk-panel">
            <p className="k-memo-hint">カレンダーの日付、または表の左のチェックで日を選び、業務内容をまとめて入力します。</p>
            <div className="k-bulk-row">
              <button className="k-bulk-chip" onClick={() => selectDays((d) => isWeekend(view.y, view.m, d))}>土日を選択</button>
              <button className="k-bulk-chip" onClick={() => selectDays(() => true)}>全日を選択</button>
              <button className="k-bulk-chip" onClick={() => setBulkSel({})}>選択解除</button>
              <span className="k-bulk-count">{selectedKeys.length}日選択中</span>
            </div>
            <div className="k-bulk-row">
              <select className="k-note-select k-bulk-select" value={bulkNote} onChange={(e) => setBulkNote(e.target.value)}>
                <option value="">業務内容を選択…</option>
                {workTypeOptions.filter((o) => o).map((opt) => (
                  <option key={opt} value={opt}>{opt}</option>
                ))}
                <option value={BULK_CLEAR}>― 空にする(出退勤も消えます)</option>
              </select>
              <button className="k-btn-secondary" disabled={!bulkNote || !selectedKeys.length} onClick={applyBulk}>選択日に入力</button>
            </div>
            {bulkNote === NIGHT_NOTE && workTypeOptions.includes(AFTER_NIGHT_NOTE) && (
              <label className="k-bulk-check">
                <input type="checkbox" checked={bulkAddAfter} onChange={(e) => setBulkAddAfter(e.target.checked)} />
                翌日に「{AFTER_NIGHT_NOTE}」も入力する(未入力の日のみ)
              </label>
            )}
            <div className="k-bulk-row">
              <button className="k-btn-secondary-outline" onClick={copyPrevMonth}>📋 {prevMonth}月のパターンをコピー</button>
            </div>
            {bulkMsg && <div className="k-bulk-msg">{bulkMsg}</div>}
          </div>
        )}

        <div className="k-mini-cal">
          <div className="k-mini-cal-weekdays">
            {["日", "月", "火", "水", "木", "金", "土"].map((wd) => (
              <div key={wd} className={`k-mini-cal-wd ${wd === "日" || wd === "土" ? "k-weekend-text" : ""}`}>{wd}</div>
            ))}
          </div>
          <div className="k-mini-cal-grid">
            {Array.from({ length: (new Date(view.y, view.m - 1, 1).getDay()) }).map((_, i) => (
              <div key={`blank-${i}`} className="k-mini-cal-day k-mini-cal-blank" />
            ))}
            {dayList.map((d) => {
              const key = dateKey(view.y, view.m, d);
              const rec = records[key];
              const isToday = key === todayKey;
              const weekend = isWeekend(view.y, view.m, d);
              const cls = [
                "k-mini-cal-day",
                isToday ? "k-mini-cal-today" : "",
                rec?.isLeave ? "k-mini-cal-leave" : "",
                weekend && !isToday && !rec?.isLeave ? "k-weekend-text" : "",
                bulkMode && bulkSel[key] ? "k-mini-cal-selected" : "",
              ].join(" ").trim();
              return (
                <button key={key} className={cls} onClick={() => (bulkMode ? toggleSelect(key) : jumpToDate(key))} title={`${d}日${rec?.note ? " " + rec.note : ""}`}>
                  <span className="k-mini-cal-daynum">{d}</span>
                  {rec?.note && <span className="k-mini-cal-note">{rec.note}</span>}
                </button>
              );
            })}
          </div>
        </div>

        <div className="k-table-wrap">
          <table className="k-table">
            <thead>
              <tr>
                <th className="k-col-date">日付</th>
                <th className="k-col-note">業務内容</th>
                <th>出勤</th>
                <th>退勤</th>
                <th className="k-col-ot">時間外</th>
                <th className="k-col-work">作業時間</th>
                <th className="k-col-remark">備考</th>
              </tr>
            </thead>
            <tbody>
              {dayList.map((d) => {
                const key = dateKey(view.y, view.m, d);
                const rec = records[key] || {};
                const weekend = isWeekend(view.y, view.m, d);
                const isToday = key === todayKey;
                const dayLocked = !!rec.locked;
                const rowClass = rec.isLeave ? "k-leave-row" : isToday ? "k-today" : d % 2 === 0 ? "k-stripe-b" : "k-stripe-a";
                let otMinutes = 0;
                let workText = "―";
                const hasBasis = (rec.clockIn && rec.clockOut) || (rec.otStart && rec.otEnd);
                if (!rec.isLeave && hasBasis) {
                  otMinutes = overtimeMinutesFor(rec);
                  workText = minutesToLabel(standardHoursFor(rec) * 60 + otMinutes);
                }
                return (
                  <tr key={key} id={`row-${key}`} className={bulkMode && bulkSel[key] ? `${rowClass} k-row-selected` : rowClass}>
                    <td className="k-col-date" data-label="日付">
                      {bulkMode && (
                        <input
                          type="checkbox"
                          className="k-bulk-checkbox"
                          checked={!!bulkSel[key]}
                          onChange={() => toggleSelect(key)}
                          title="一括入力の対象にする"
                        />
                      )}
                      <span className="k-day-num">{d}</span>
                      <span className={`k-day-wd ${weekend ? "k-weekend-text" : ""}`}>（{weekdayLabel(view.y, view.m, d)}）</span>
                      <button
                        className={`k-lock-btn ${dayLocked ? "k-lock-btn-locked" : ""}`}
                        onClick={() => toggleDayLock(key)}
                        title="この日をロック/解除"
                      >
                        {dayLocked ? "🔒 ロック中" : "🔓 編集可"}
                      </button>
                    </td>
                    <td className="k-col-note" data-label="業務内容">
                      <select
                        className="k-note-select"
                        disabled={dayLocked}
                        style={holidayTypes.includes(rec.note) ? { color: "#a35d4e", fontWeight: 700 } : undefined}
                        value={rec.note || ""}
                        onChange={(e) => { onNoteChange(key, e.target.value); suggestAfterNight(key, e.target.value); }}
                      >
                        {workTypeOptions.map((opt) => (
                          <option key={opt || "blank"} value={opt} style={holidayTypes.includes(opt) ? { color: "#a35d4e" } : undefined}>
                            {opt || "―"}
                          </option>
                        ))}
                      </select>
                    </td>
                    {rec.isLeave ? (
                      <td colSpan={2} className="k-leave-cell" data-label="出勤・退勤">
                        <div className="k-leave-inner">
                          <span className="k-leave-stamp">有休</span>
                          <button className="k-mini-btn" disabled={dayLocked} onClick={() => toggleLeave(key, false)} title="有休を取消">↺</button>
                        </div>
                      </td>
                    ) : (
                      <>
                        <td data-label="出勤">
                          <input type="time" disabled={dayLocked} value={rec.clockIn || ""} onChange={(e) => updateRecord(key, { clockIn: e.target.value })} />
                        </td>
                        <td data-label="退勤">
                          <input type="time" disabled={dayLocked} value={rec.clockOut || ""} onChange={(e) => updateRecord(key, { clockOut: e.target.value })} />
                        </td>
                      </>
                    )}
                    <td className="k-ot-cell" data-label="時間外">
                      {rec.isLeave ? (
                        "―"
                      ) : (
                        <div className="k-ot-range">
                          <div className="k-ot-range-inputs">
                            <input type="time" disabled={dayLocked} className="k-ot-time" value={rec.otStart || ""}
                              onChange={(e) => updateRecord(key, { otStart: e.target.value })} />
                            <span>〜</span>
                            <input type="time" disabled={dayLocked} className="k-ot-time" value={rec.otEnd || ""}
                              onChange={(e) => updateRecord(key, { otEnd: e.target.value })} />
                          </div>
                          <div className={`k-ot-result ${rec.otStart && rec.otEnd ? "k-ot-manual" : ""}`}>
                            {hasBasis ? minutesToLabel(otMinutes) : "―"}
                          </div>
                        </div>
                      )}
                    </td>
                    <td className="k-ot-cell k-work-cell k-col-work" data-label="作業時間">{workText}</td>
                    <td className="k-col-remark" data-label="備考">
                      {rec.isLeave ? (
                        <span className="k-leave-seq-cell">{allLeaveDatesSorted.indexOf(key) + 1}回目</span>
                      ) : (
                        <input
                          type="text"
                          disabled={dayLocked}
                          className="k-remark-input"
                          placeholder="備考"
                          title={rec.remark || ""}
                          value={rec.remark || ""}
                          onChange={(e) => updateRecord(key, { remark: e.target.value })}
                        />
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="k-bottom">
        <div className="k-card">
          <h3>今月のまとめ</h3>
          <dl className="k-stat-list">
            <div><dt>勤務日数</dt><dd>{monthWorkDays}日</dd></div>
            <div><dt>休日</dt><dd>{monthHolidays}日</dd></div>
            <div><dt>法定</dt><dd>{monthStatutoryHolidays}日</dd></div>
            <div><dt>法定休日労働</dt><dd>{minutesToLabel(monthStatutoryWork)}</dd></div>
            <div><dt>有給取得日数</dt><dd>{monthLeaveDays}日</dd></div>
          </dl>
          <div className="k-limit-list">
            {limitChecks.map((c) => <LimitMeter key={c.label} {...c} />)}
          </div>
          <p className="k-limit-note">
            36協定の一般的な上限（月45時間・年360時間、休日労働を含め月100時間未満）で判定しています。
            「法定」の日の労働は法定休日労働として別に集計し、時間外には含めません。特別条項の上限には対応していません。
          </p>
        </div>
        <div className="k-bottom-buttons">
          <button className="k-btn-secondary" onClick={() => setShowLeave(true)}>🗓 有給休暇</button>
          <button className="k-btn-secondary" onClick={() => setShowMemo(true)}>📝 メモ</button>
          <button className="k-settings-toggle" onClick={() => setShowSettings(true)}>⚙ 設定</button>
        </div>
      </div>

      {suggestion && (
        <div className="k-suggest">
          <span>
            泊の翌日（{Number(suggestion.key.slice(5, 7))}月{Number(suggestion.key.slice(8, 10))}日）を「{suggestion.note}」にしますか？
          </span>
          <button className="k-btn-secondary" onClick={acceptSuggestion}>入力する</button>
          <button className="k-btn-secondary-outline" onClick={() => setSuggestion(null)}>閉じる</button>
        </div>
      )}

      {showLeave && (
        <div className="k-modal-overlay" onClick={() => setShowLeave(false)}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>有給休暇（{view.y}年）</h3>
              <button className="k-icon-btn" onClick={() => setShowLeave(false)}>✕</button>
            </div>
            <dl className="k-stat-list">
              <div><dt>付与日数</dt><dd>{settings.paidLeaveTotal}日</dd></div>
              <div><dt>取得日数</dt><dd>{leavesThisYear}日</dd></div>
              <div><dt className="k-highlight">残日数</dt><dd className="k-highlight">{leaveRemaining}日</dd></div>
            </dl>
            <div className="k-leave-add">
              <input type="date" value={leavePickDate} onChange={(e) => setLeavePickDate(e.target.value)} />
              <button className="k-btn-secondary" onClick={addLeave} disabled={!leavePickDate}>＋ 取得登録</button>
            </div>
            {leaveDatesThisYear.length > 0 && (
              <ul className="k-leave-dates">
                {leaveDatesThisYear.map((k) => {
                  const [y, m, d] = k.split("-").map(Number);
                  const seq = allLeaveDatesSorted.indexOf(k) + 1;
                  return (
                    <li key={k}>
                      <span>{m}月{d}日（{weekdayLabel(y, m, d)}）<span className="k-leave-seq">{seq}回目</span></span>
                      <button className="k-mini-btn" onClick={() => toggleLeave(k, false)} title="有休を取消">↺</button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </div>
      )}

      {showMemo && (
        <div className="k-modal-overlay" onClick={() => setShowMemo(false)}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>メモ・使用方法</h3>
              <button className="k-icon-btn" onClick={() => setShowMemo(false)}>✕</button>
            </div>
            <p className="k-memo-hint">出勤簿の使い方や注意点など、自由に書き留めておけます。</p>
            <textarea
              className="k-memo-textarea"
              value={memo}
              onChange={(e) => setMemo(e.target.value)}
              placeholder="ここにメモを入力…"
            />
          </div>
        </div>
      )}

      {showSettings && (
        <div className="k-modal-overlay" onClick={() => { setShowSettings(false); setConfirmReset(false); }}>
          <div className="k-modal" onClick={(e) => e.stopPropagation()}>
            <div className="k-modal-head">
              <h3>設定</h3>
              <button className="k-icon-btn" onClick={() => { setShowSettings(false); setConfirmReset(false); }}>✕</button>
            </div>
            <label className="k-field">
              所定労働時間
              <select value={settings.standardHours} onChange={(e) => setSettings((s) => ({ ...s, standardHours: Number(e.target.value) }))}>
                <option value="8">08:00</option>
                <option value="7.5">07:30</option>
                <option value="6.5">06:30</option>
                <option value="6">06:00</option>
              </select>
            </label>
            <label className="k-field">
              年間有給付与日数
              <input
                type="number" min="0" max="40" step="1"
                value={settings.paidLeaveTotal}
                onChange={(e) => setSettings((s) => ({ ...s, paidLeaveTotal: Number(e.target.value) || 0 }))}
              />
            </label>

            <div className="k-io-zone">
              <button className="k-btn-secondary-outline" onClick={handleExport}>⬇ データをエクスポート</button>
              <button className="k-btn-secondary-outline" onClick={() => fileInputRef.current && fileInputRef.current.click()}>⬆ データをインポート</button>
              <button className="k-btn-secondary-outline" onClick={() => workTypeFileRef.current && workTypeFileRef.current.click()}>
                🛠 業務内容の自動入力設定をCSVで更新
              </button>
              <button className="k-btn-secondary-outline" onClick={() => ledgerCsvFileRef.current && ledgerCsvFileRef.current.click()}>
                📄 業務内容CSVから取り込み
              </button>
            </div>

            <div className="k-backup-zone">
              <p className="k-memo-hint">バックアップ(直近{BACKUP_KEEP_DAYS}日分・このブラウザ内に保存)</p>
              {backups.length === 0 ? (
                <p className="k-memo-hint">まだありません。</p>
              ) : (
                <ul className="k-leave-dates">
                  {backups.map((b, i) => (
                    <li key={`${b.at}-${b.reason}-${i}`}>
                      <span>{b.at}<span className="k-leave-seq">{b.reason}</span></span>
                      <button className="k-mini-btn" onClick={() => restoreBackup(b)} title="この時点に復元">↩ 復元</button>
                    </li>
                  ))}
                </ul>
              )}
            </div>

            <div className="k-danger-zone">
              {!confirmReset ? (
                <button className="k-btn-danger" onClick={() => setConfirmReset(true)}>🗑 入力データをリセット</button>
              ) : (
                <div className="k-danger-confirm">
                  <p>すべての出退勤記録・業務内容・有給休暇の記録を削除します。この操作は元に戻せません。</p>
                  <div className="k-danger-confirm-buttons">
                    <button className="k-btn-danger" onClick={resetAllData}>削除する</button>
                    <button className="k-btn-secondary-outline" onClick={() => setConfirmReset(false)}>キャンセル</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KintaiApp />);
</script>
